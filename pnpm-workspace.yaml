packages:
  - 'backend'
  - 'frontend'

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  argon2: true
  # Install scripts these packages ship are not needed (telemetry and funding notices).
  '@fission-ai/openspec': false
  '@nestjs/core': false
  '@scarf/scarf': false
  # Prebuilt native binaries arrive as optional dependencies; the fallback builds are unused.
  '@parcel/watcher': false
  unrs-resolver: false

# @nestjs/platform-express pins multer exactly; 2.5.0 fixes GHSA-q7qp-rjg7-q26m in the same
# major. Remove when an adopted Nest release supplies it (docs/dependency-security.md).
overrides:
  '@nestjs/platform-express@12.1.3>multer': 2.5.0
