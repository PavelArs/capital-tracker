services:
  postgres:
    image: postgres:16-alpine
    container_name: capital_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-capital_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capital-tracker-network

  redis:
    image: redis:7-alpine
    container_name: capital_tracker_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capital-tracker-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/pavelars/capital-tracker-backend:latest}
    container_name: capital_tracker_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-capital_tracker}
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?Set exact observed proxy socket IPs as JSON or explicit [] for direct mode}
      MFA_KEY_FILE: /run/secrets/ct-mfa-key
      MFA_KEY_ID: ${MFA_KEY_ID:?Set the non-secret MFA key identifier}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - type: bind
        source: ${MFA_KEY_FILE:?Set an absolute path to the private MFA key file}
        target: /run/secrets/ct-mfa-key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - capital-tracker-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/pavelars/capital-tracker-frontend:latest}
    container_name: capital_tracker_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - capital-tracker-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  capital-tracker-network:
    driver: bridge
