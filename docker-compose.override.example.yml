services:
  postgres:
    ports:
      - "5432:5432"
    restart: "no"

  redis:
    ports:
      - "6379:6379"
    restart: "no"

  backend:
    image: capital-tracker-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-in-production
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: capital-tracker-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: "no"
    ports:
      - "3001:80"
