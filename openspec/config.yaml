schema: spec-driven
context: |
  Brownfield Capital Tracker; target: capital-tracker-openspec-prompt.md.
  NestJS 11, TypeORM, PostgreSQL 16, React/Vite, Chart.js, pnpm 10.33.0.
  Incremental refactor into a Russian single-owner crypto portfolio app.
  Preserve data and unrelated edits. No production rollout without owner authorization.
  Exact decimal accounting, database-first history, read-only blockchains, verified free providers.
  OpenSpec CLI 1.2.0 core profile; document equivalent verification (no verify command installed).
rules:
  proposal:
    - Include non-goals, data impact and change dependencies.
  specs:
    - Use stable requirement/scenario IDs and observable Given/When/Then cases.
    - Specify error cases and authorization/data-integrity invariants.
  design:
    - Explain migration, security, quota and rollback consequences where applicable.
  tasks:
    - Link scenarios to executable tests and actual RED/GREEN evidence.
    - Preserve passing characterization tests for pure refactors without artificial RED.
    - Require independent review and real PostgreSQL/HTTPS Playwright for affected critical journeys.
    - Archive only after required verification passes; record blockers honestly.
