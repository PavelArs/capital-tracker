# Add this job under `scrape_configs:` of your existing Prometheus.
#
# The backend serves /metrics on its own port (9464) and Compose does not publish that port,
# so Prometheus must share a Docker network with the backend container. Once, on the server:
#
#   docker network connect <project>_capital-tracker-network <your-prometheus-container>
#
# (`docker network ls` shows the exact name; <project> is the Compose project name.)
# `docker network connect` is lost when the Prometheus container is recreated; to make it
# permanent, declare that network as `external: true` in the Prometheus compose file.
- job_name: capital-tracker-backend
  scrape_interval: 30s
  scrape_timeout: 10s
  metrics_path: /metrics
  static_configs:
    - targets: ['capital_tracker_backend:9464']
