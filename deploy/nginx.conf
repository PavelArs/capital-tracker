# Capital Tracker - nginx host configuration template
# Copy to /etc/nginx/sites-available/ and symlink to sites-enabled/
# Replace <your-domain> with your actual domain

server {
    listen 80;
    server_name <your-domain>;
    return 301 https://<your-domain>$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <your-domain>;

    ssl_certificate /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One edge only: replace user-supplied identity headers with the socket peer.
    # Keep these together at server level; a location-level proxy_set_header would
    # prevent inheritance of this entire set.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The application page loads only its own scripts and calls only its own API. API
    # responses also carry the backend's policy; a browser enforces both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API -> backend container (port 3000)
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # Frontend -> frontend container (port 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
