name: ${CAPITAL_E2E_PROJECT:-capital-tracker-e2e}

x-backend: &backend
  image: capital-tracker-backend:acceptance
  build:
    context: ../..
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    NODE_ENV: production
    PORT: "3000"
    BACKGROUND_JOBS_ENABLED: "false"
    DISPLAY_FX_ENABLED: "true"
    DISPLAY_FX_TRUST_PROXY: "true"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: capital_e2e
    DB_PASSWORD: capital_e2e
    DB_NAME: capital_tracker_e2e
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # Keep real startup-loaded rates warm throughout the bounded acceptance gate.
    # Warm-cache restart cases do not assert expiry; accounting permits zero calls.
    EXCHANGE_RATES_CACHE_TTL: "86400000"
    FRONTEND_URL: https://127.0.0.1:8443
    MFA_KEY_FILE: /run/secrets/ct-mfa-key
    MFA_KEY_ID: acceptance-only
    TRUSTED_PROXY_IPS: '["172.30.91.2"]'
    HTTPS_PROXY: http://providers:8080
    HTTP_PROXY: http://providers:8080
    NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,frontend,providers
    NODE_EXTRA_CA_CERTS: /run/acceptance/provider-ca.pem
    # Synthetic key the providers fixture accepts for its Etherscan stub; never a real one.
    ETHERSCAN_API_KEY: acceptance-etherscan-key
  # Keep the image health command and failure policy; observe readiness sooner.
  healthcheck:
    interval: 2s
    start_interval: 2s
    start_period: 30s # Compose requires this with start_interval; equals the image.
  networks: [isolated]
  volumes:
    - ./.runtime/mfa-key:/run/secrets/ct-mfa-key:ro
    - ./.runtime/provider-tls/fullchain.pem:/run/acceptance/provider-ca.pem:ro

services:
  postgres:
    image: capital-tracker-postgres:acceptance
    build:
      context: ../..
      dockerfile: deploy/postgres.Dockerfile
      labels:
        org.opencontainers.image.revision: ${CAPITAL_RELEASE_COMMIT:-local-acceptance}
    platform: linux/amd64
    environment:
      POSTGRES_DB: capital_tracker_e2e
      POSTGRES_USER: capital_e2e
      POSTGRES_PASSWORD: capital_e2e
      PGDATA: /var/lib/postgresql/18/docker
    tmpfs:
      - /var/lib/postgresql
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U capital_e2e -d capital_tracker_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-alpine3.23@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
    platform: linux/amd64
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [isolated]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  providers:
    image: node:26.10.0-alpine
    user: node
    command: [node, /tests/providers.cjs]
    volumes:
      - ./providers.cjs:/tests/providers.cjs:ro
      - ./.runtime/provider-tls:/tests/tls:ro
    networks: [isolated]
    read_only: true
    # PID 1 is plain node without a SIGTERM handler: stopping it only ever ends in SIGKILL,
    # so skip the default 10 s grace period at every teardown.
    stop_grace_period: 1s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    profiles: [tools]
    command: [node, backend/dist/migrate.js]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *backend
    profiles: [tools]
    command: [node, /tests/seed.cjs]
    environment:
      <<: *backend-environment
      NODE_PATH: /app/backend/node_modules
    volumes:
      - ./:/tests:ro
      - ./.runtime/mfa-key:/run/secrets/ct-mfa-key:ro
      - ./.runtime/provider-tls/fullchain.pem:/run/acceptance/provider-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    networks:
      isolated:
        ipv4_address: 172.30.91.10
    depends_on: &runtime-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      providers:
        condition: service_healthy

  backend-replica:
    <<: *backend
    networks:
      isolated:
        ipv4_address: 172.30.91.11
    depends_on: *runtime-dependencies

  frontend:
    image: capital-tracker-frontend:acceptance
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    networks: [isolated]

  proxy:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${CAPITAL_E2E_HTTPS_PORT:-8443}:443"
    volumes:
      - ./.runtime/deploy-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.runtime/tls:/etc/nginx/tls:ro
    # Docker Desktop needs a non-internal network for published host ingress.
    # Only this fixed-upstream HTTPS proxy joins it; application egress stays isolated.
    networks:
      ingress: {}
      isolated:
        ipv4_address: 172.30.91.2
      clients:
        ipv4_address: 172.30.90.2
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  client-a:
    image: capital-tracker-backend:acceptance
    command: [node, -e, "setInterval(() => {}, 60000)"]
    # Same as providers: the dormant client ignores SIGTERM, so do not wait 10 s for it.
    stop_grace_period: 1s
    networks:
      clients:
        ipv4_address: 172.30.90.10
    volumes:
      - ./source-client.cjs:/tests/client.cjs:ro
      - ./.runtime/tls/fullchain.pem:/tests/public-ca.pem:ro
    read_only: true
    # Dormant request clients have no HTTP server; wait for their actual process
    # and the two read-only request fixtures rather than the image's backend health.
    healthcheck: &client-readiness
      test: [CMD, node, -e, "process.kill(1,0); const fs=require('node:fs'); for (const file of ['/tests/client.cjs','/tests/public-ca.pem']) fs.accessSync(file,fs.constants.R_OK)"]
      interval: 2s
      timeout: 3s
      retries: 30

  client-b:
    image: capital-tracker-backend:acceptance
    command: [node, -e, "setInterval(() => {}, 60000)"]
    stop_grace_period: 1s
    networks:
      clients:
        ipv4_address: 172.30.90.11
    volumes:
      - ./source-client.cjs:/tests/client.cjs:ro
      - ./.runtime/tls/fullchain.pem:/tests/public-ca.pem:ro
    read_only: true
    healthcheck: *client-readiness

networks:
  ingress:
    driver: bridge
  isolated:
    internal: true
    ipam:
      config:
        - subnet: 172.30.91.0/24
          ip_range: 172.30.91.128/25
  clients:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/24
