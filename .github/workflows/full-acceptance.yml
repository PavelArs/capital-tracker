name: Full acceptance

# The whole browser and PostgreSQL suite (`pnpm test:e2e`): CI runs only the critical subset.
# Nightly on main and on demand; a pull request runs it only when it changes this file.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/full-acceptance.yml]

permissions:
  contents: read

concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.10.0"

jobs:
  full-acceptance:
    name: Full acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use the Docker Hub mirror for pulls
        if: runner.environment == 'github-hosted'
        run: bash scripts/ci-docker-mirror.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the full acceptance suite
        run: pnpm test:e2e
      - name: Stop the synthetic stack
        if: always()
        run: pnpm test:e2e:down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
