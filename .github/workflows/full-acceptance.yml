name: Full acceptance

# The whole browser and PostgreSQL suite (`pnpm test:e2e`): CI runs only the critical subset.
# Nightly on main and on demand; a pull request runs it only when it changes this file.
# The nightly run is skipped when main has not moved since the previous completed run.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/full-acceptance.yml]

permissions:
  contents: read

concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.10.0"

jobs:
  new-commits:
    name: New commits since the last run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            # A cancelled run never finished the suite, so it does not count as the previous run.
            previous=$(gh api "repos/$REPO/actions/workflows/full-acceptance.yml/runs?branch=main&status=completed&per_page=30" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID and .conclusion != \"cancelled\")][0] | [.head_sha // \"\", .html_url // \"\"] | @tsv")
            previous_sha=$(printf '%s' "$previous" | cut -f1)
            previous_url=$(printf '%s' "$previous" | cut -f2)
            if [ -n "$previous_sha" ] && [ "$previous_sha" = "$SHA" ]; then
              run=false
              echo "No new commits on main since ${SHA:0:7}: the previous run already covered it ($previous_url). Skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Main moved from ${previous_sha:-none} to $SHA: running the full acceptance suite." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "$EVENT runs always execute the suite." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The browser files are split over four runners (Playwright `--shard`); runner 1 also runs the
  # containerized probes. Every runner has its own synthetic stack, so the slices do not share state.
  acceptance-shard:
    name: Acceptance shard ${{ matrix.index }}
    needs: new-commits
    if: needs.new-commits.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Same key as the CI browser shards and the main-only "Warm Playwright Browser Cache" job:
      # a browser saved on main is restored here, and a miss on main saves it for them.
      - name: Restore the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run this slice of the full acceptance suite
        env:
          ACCEPTANCE_FULL_SHARD: ${{ matrix.index }}/4
        run: pnpm test:e2e
      - name: Stop the synthetic stack
        if: always()
        run: pnpm test:e2e:down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full-acceptance-report-${{ matrix.index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One stable result for the whole run: "Full acceptance" passes when the guard skipped the
  # suite or all four slices passed, and fails when the guard or any slice failed or was cancelled.
  full-acceptance:
    name: Full acceptance
    needs: [new-commits, acceptance-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GUARD: ${{ needs.new-commits.result }}
          RUN: ${{ needs.new-commits.outputs.run }}
          SHARDS: ${{ needs.acceptance-shard.result }}
        run: |
          set -euo pipefail
          if [ "$GUARD" != success ]; then
            echo "The new-commits check ended as $GUARD." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "Skipped: no new commits on main since the previous run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SHARDS" != success ]; then
            echo "The acceptance slices ended as $SHARDS." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All four acceptance slices passed." | tee -a "$GITHUB_STEP_SUMMARY"
