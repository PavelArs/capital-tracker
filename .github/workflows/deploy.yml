name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_REGISTRY: registry.yandexcloud.net
  BACKEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-backend
  FRONTEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ secrets.YC_TOKEN }}" | docker login --username oauth --password-stdin registry.yandexcloud.net

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:/opt/capital-tracker/docker-compose.yml

      - name: Deploy application
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker
            
            # Login to Yandex Container Registry
            echo "$YC_TOKEN" | docker login --username oauth --password-stdin registry.yandexcloud.net || true
            
            # Pull latest images
            docker compose pull || docker-compose pull
            
            # Stop and remove old containers
            docker compose down || docker-compose down || true
            
            # Start new containers
            docker compose up -d || docker-compose up -d
            
            # Clean up old images
            docker image prune -f
            
            # Show status
            docker compose ps || docker-compose ps
          EOF

      - name: Health check
        run: |
          sleep 10
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << 'EOF'
            cd /opt/capital-tracker
            docker compose ps || docker-compose ps
            echo "Checking backend health..."
            curl -f http://localhost:3000/health || exit 1
            echo "Backend is healthy!"
          EOF

      - name: Generate Release Notes
        id: release_notes
        if: success()
        run: |
          chmod +x .github/scripts/generate-release-notes.sh
          .github/scripts/generate-release-notes.sh > release_notes.txt
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Check if Telegram secrets are configured
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets not configured, skipping notification"
            exit 0
          fi

          # Determine deployment status
          if [ "${{ job.status }}" == "success" ] && [ "${{ steps.release_notes.outputs.success }}" == "true" ]; then
            # Send release notes for successful deployment
            MESSAGE=$(cat release_notes.txt)
          else
            # Send failure notification
            DEPLOY_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
            COMMIT_SHORT=${GITHUB_SHA:0:7}
            MESSAGE=$(cat <<EOF
          ❌ **Capital Tracker Deployment FAILED**

          📅 **Date:** ${DEPLOY_DATE}
          🔖 **Commit:** \`${COMMIT_SHORT}\`
          🔗 **Workflow:** [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Status:** Deployment or health check failed. Please review the logs.
          EOF
          )
          fi

          # Send message to Telegram using a temp file to avoid escaping issues
          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null || echo "⚠️ Failed to send Telegram notification"
