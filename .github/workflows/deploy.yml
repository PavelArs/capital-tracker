name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_REGISTRY: cr.yandex
  BACKEND_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-backend
  FRONTEND_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ secrets.YC_TOKEN }}" | docker login --username oauth --password-stdin cr.yandex

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.prod.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:/opt/capital-tracker/docker-compose.prod.yml

      - name: Deploy application
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker
            
            # Login to Yandex Container Registry
            echo "$YC_TOKEN" | docker login --username iam --password-stdin cr.yandex || true
            
            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull || docker compose -f docker-compose.prod.yml pull
            
            # Stop and remove old containers
            docker-compose -f docker-compose.prod.yml down || docker compose -f docker-compose.prod.yml down || true
            
            # Start new containers
            docker-compose -f docker-compose.prod.yml up -d || docker compose -f docker-compose.prod.yml up -d
            
            # Clean up old images
            docker image prune -f
            
            # Show status
            docker-compose -f docker-compose.prod.yml ps || docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Health check
        run: |
          sleep 10
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << 'EOF'
            cd /opt/capital-tracker
            docker-compose -f docker-compose.prod.yml ps || docker compose -f docker-compose.prod.yml ps
            echo "Checking backend health..."
            curl -f http://localhost:3000/health || exit 1
            echo "Backend is healthy!"
          EOF
