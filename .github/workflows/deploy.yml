name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_REGISTRY: registry.yandexcloud.net
  BACKEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-backend
  FRONTEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-frontend
  HEALTH_CHECK_TIMEOUT: 180 # seconds
  HEALTH_CHECK_INTERVAL: 10 # seconds
  HEALTH_CHECK_RETRIES: 3

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ secrets.YC_TOKEN }}" | docker login --username oauth --password-stdin registry.yandexcloud.net

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for release notes generation

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Get current running versions (for rollback)
        id: get-versions
        run: |
          CURRENT_BACKEND=$(ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
            "docker inspect capital-tracker-backend-1 --format='{{.Config.Image}}' 2>/dev/null || \
             docker inspect capital_tracker_backend --format='{{.Config.Image}}' 2>/dev/null || \
             echo 'none'")
          CURRENT_FRONTEND=$(ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
            "docker inspect capital-tracker-frontend-1 --format='{{.Config.Image}}' 2>/dev/null || \
             docker inspect capital_tracker_frontend --format='{{.Config.Image}}' 2>/dev/null || \
             echo 'none'")

          # Use EOF delimiter for safe output with special characters
          {
            echo "current-backend<<EOF"
            echo "$CURRENT_BACKEND"
            echo "EOF"
            echo "current-frontend<<EOF"
            echo "$CURRENT_FRONTEND"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "📦 Current Backend: $CURRENT_BACKEND"
          echo "📦 Current Frontend: $CURRENT_FRONTEND"

      - name: Create Database Backup
        id: backup-db
        run: |
          BACKUP_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILENAME="capital-tracker-backup-${BACKUP_TIMESTAMP}.sql.gz"

          echo "💾 Creating database backup: $BACKUP_FILENAME"

          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker
            
            # Create backups directory if not exists
            mkdir -p backups
            
            # Get database credentials from environment or .env
            DB_NAME=\$(grep DB_NAME .env 2>/dev/null | cut -d '=' -f2 || echo 'capital_tracker')
            DB_USER=\$(grep DB_USERNAME .env 2>/dev/null | cut -d '=' -f2 || echo 'postgres')
            DB_PASSWORD=\$(grep DB_PASSWORD .env 2>/dev/null | cut -d '=' -f2 || echo 'postgres')
            
            # Get postgres container name
            POSTGRES_CONTAINER=\$(docker compose ps -q postgres || docker-compose ps -q postgres)
            
            if [ -z "\$POSTGRES_CONTAINER" ]; then
              echo "⚠️  Postgres container not found, trying alternative names..."
              POSTGRES_CONTAINER=\$(docker ps -q -f name=capital_tracker_db || docker ps -q -f name=capital-tracker-postgres)
            fi
            
            if [ -z "\$POSTGRES_CONTAINER" ]; then
              echo "❌ Postgres container not found!"
              exit 1
            fi
            
            echo "📦 Creating backup from container: \$POSTGRES_CONTAINER"
            
            # Create backup using pg_dump
            docker exec \$POSTGRES_CONTAINER pg_dump -U \$DB_USER -d \$DB_NAME | gzip > backups/$BACKUP_FILENAME
            
            BACKUP_SIZE=\$(du -h backups/$BACKUP_FILENAME | cut -f1)
            echo "✅ Backup created: $BACKUP_FILENAME (Size: \$BACKUP_SIZE)"
            
            # Keep only last 10 backups (sorted by date)
            cd backups
            ls -t capital-tracker-backup-*.sql.gz | tail -n +11 | xargs -r rm
            echo "🧹 Cleaned up old backups (keeping last 10)"
            
            # List current backups
            echo "📋 Available backups:"
            ls -lh capital-tracker-backup-*.sql.gz | tail -5
          EOF

          # Use EOF delimiter for safe output
          {
            echo "backup-filename<<EOF"
            echo "$BACKUP_FILENAME"
            echo "EOF"
            echo "backup-timestamp<<EOF"
            echo "$BACKUP_TIMESTAMP"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Copy docker-compose.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:/opt/capital-tracker/docker-compose.yml

      - name: Deploy application
        id: deploy
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker
            
            # Login to Yandex Container Registry
            echo "$YC_TOKEN" | docker login --username oauth --password-stdin registry.yandexcloud.net || true
            
            # Pull latest images
            docker compose pull || docker-compose pull
            
            # Stop and remove old containers
            docker compose down || docker-compose down || true
            
            # Start new containers
            docker compose up -d || docker-compose up -d
            
            # Clean up old images
            docker image prune -f
            
            # Show status
            docker compose ps || docker-compose ps
          EOF

      - name: Wait for services to start
        run: |
          echo "⏳ Waiting for services to initialize (30 seconds)..."
          sleep 30

      - name: Health Check with Retry
        id: health-check
        run: |
          MAX_ATTEMPTS=$(( ${{ env.HEALTH_CHECK_TIMEOUT }} / ${{ env.HEALTH_CHECK_INTERVAL }} ))
          ATTEMPT=0
          SUCCESS=false

          echo "🏥 Starting health checks"
          echo "⏱️  Timeout: ${{ env.HEALTH_CHECK_TIMEOUT }}s, Interval: ${{ env.HEALTH_CHECK_INTERVAL }}s"

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            # Check health via SSH
            if ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
              "curl -f http://localhost:3000/health" 2>/dev/null; then
              echo "✅ Health check PASSED"
              SUCCESS=true
              break
            else
              echo "⚠️  Health check failed"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Retrying in ${{ env.HEALTH_CHECK_INTERVAL }}s..."
                sleep ${{ env.HEALTH_CHECK_INTERVAL }}
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Health check FAILED after $MAX_ATTEMPTS attempts"
            echo "health-status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "health-status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Rollback on failure
        if: failure() && steps.get-versions.outputs.current-backend != 'none'
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          PREV_BACKEND: ${{ steps.get-versions.outputs.current-backend }}
          PREV_FRONTEND: ${{ steps.get-versions.outputs.current-frontend }}
          BACKUP_FILE: ${{ steps.backup-db.outputs.backup-filename }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          echo "🔄 INITIATING ROLLBACK..."
          echo "Rolling back to previous versions:"
          echo "Backend: $PREV_BACKEND"
          echo "Frontend: $PREV_FRONTEND"
          echo "Database backup: $BACKUP_FILE"

          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
            "YC_TOKEN='$YC_TOKEN' PREV_BACKEND='$PREV_BACKEND' PREV_FRONTEND='$PREV_FRONTEND' BACKUP_FILE='$BACKUP_FILE' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" << 'ENDSSH'
            set -e
            cd /opt/capital-tracker
            
            # Login to registry
            echo "$YC_TOKEN" | docker login --username oauth --password-stdin registry.yandexcloud.net || true
            
            # Pull previous images if they exist
            if [ -n "$PREV_BACKEND" ] && [ "$PREV_BACKEND" != "none" ]; then
              echo "Pulling backend: $PREV_BACKEND"
              docker pull "$PREV_BACKEND" || true
              docker tag "$PREV_BACKEND" "${BACKEND_IMAGE}:latest" || true
            fi
            
            if [ -n "$PREV_FRONTEND" ] && [ "$PREV_FRONTEND" != "none" ]; then
              echo "Pulling frontend: $PREV_FRONTEND"
              docker pull "$PREV_FRONTEND" || true
              docker tag "$PREV_FRONTEND" "${FRONTEND_IMAGE}:latest" || true
            fi
            
            # Restore database backup
            echo "💾 Restoring database from backup..."
            BACKUP_PATH="backups/$BACKUP_FILE"
            
            if [ -f "\$BACKUP_PATH" ]; then
              # Get database credentials
              DB_NAME=\$(grep DB_NAME .env 2>/dev/null | cut -d '=' -f2 || echo 'capital_tracker')
              DB_USER=\$(grep DB_USERNAME .env 2>/dev/null | cut -d '=' -f2 || echo 'postgres')
              
              # Get postgres container
              POSTGRES_CONTAINER=\$(docker compose ps -q postgres || docker-compose ps -q postgres || docker ps -q -f name=capital_tracker_db)
              
              if [ -n "\$POSTGRES_CONTAINER" ]; then
                # Terminate existing connections
                docker exec \$POSTGRES_CONTAINER psql -U \$DB_USER -d postgres -c \
                  "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '\$DB_NAME' AND pid <> pg_backend_pid();" || true
                
                # Drop and recreate database
                docker exec \$POSTGRES_CONTAINER psql -U \$DB_USER -d postgres -c "DROP DATABASE IF EXISTS \$DB_NAME;" || true
                docker exec \$POSTGRES_CONTAINER psql -U \$DB_USER -d postgres -c "CREATE DATABASE \$DB_NAME;"
                
                # Restore from backup
                gunzip -c "\$BACKUP_PATH" | docker exec -i \$POSTGRES_CONTAINER psql -U \$DB_USER -d \$DB_NAME
                
                echo "✅ Database restored from backup"
              else
                echo "⚠️  Postgres container not found, skipping database restore"
              fi
            else
              echo "⚠️  Backup file not found: \$BACKUP_PATH"
            fi
            
            # Restart with previous versions
            docker compose down || docker-compose down || true
            docker compose up -d || docker-compose up -d
            
            echo "⏳ Waiting for rollback to complete..."
            sleep 20
          ENDSSH

          # Verify rollback health
          ROLLBACK_ATTEMPTS=0
          ROLLBACK_MAX_ATTEMPTS=${{ env.HEALTH_CHECK_RETRIES }}
          ROLLBACK_SUCCESS=false

          while [ $ROLLBACK_ATTEMPTS -lt $ROLLBACK_MAX_ATTEMPTS ]; do
            ROLLBACK_ATTEMPTS=$((ROLLBACK_ATTEMPTS + 1))
            echo "Verifying rollback health (attempt $ROLLBACK_ATTEMPTS/$ROLLBACK_MAX_ATTEMPTS)..."
            
            if ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
              "curl -f http://localhost:3000/health" 2>/dev/null; then
              echo "✅ Rollback successful - service is healthy"
              ROLLBACK_SUCCESS=true
              break
            else
              echo "⚠️  Rollback health check failed"
              if [ $ROLLBACK_ATTEMPTS -lt $ROLLBACK_MAX_ATTEMPTS ]; then
                sleep 10
              fi
            fi
          done

          if [ "$ROLLBACK_SUCCESS" = false ]; then
            echo "❌ Rollback completed but health check failed"
            echo "⚠️  MANUAL INTERVENTION REQUIRED!"
            echo "📝 Container logs:"
            ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
              "cd /opt/capital-tracker && docker compose logs --tail=50 backend || docker-compose logs --tail=50 backend"
            exit 1
          fi

      - name: Generate Release Notes
        id: release_notes
        if: success()
        run: |
          chmod +x .github/scripts/generate-release-notes.sh
          .github/scripts/generate-release-notes.sh > release_notes.txt
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Tag Successful Deployment
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_TAG="deploy-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure git to use the GitHub token for authentication
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          git tag -a "$DEPLOY_TAG" -m "Deployment at $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin "$DEPLOY_TAG"

      - name: Cleanup old images and backups
        if: success()
        run: |
          echo "🧹 Cleaning up old Docker images and backups..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << 'EOF'
            # Keep only last 3 versions of images
            docker image prune -a -f --filter "until=72h" || true
            
            # Verify backup count (keep last 10)
            cd /opt/capital-tracker/backups 2>/dev/null || exit 0
            BACKUP_COUNT=$(ls -1 capital-tracker-backup-*.sql.gz 2>/dev/null | wc -l)
            echo "📊 Total backups: $BACKUP_COUNT"
            
            # Keep only last 10 backups
            ls -t capital-tracker-backup-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm
            echo "✅ Cleanup complete"
          EOF

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_FILENAME: ${{ steps.backup-db.outputs.backup-filename }}
          PREV_BACKEND_VER: ${{ steps.get-versions.outputs.current-backend }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_SUCCESS: ${{ steps.release_notes.outputs.success }}
        run: |
          # Check if Telegram secrets are configured
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets not configured, skipping notification"
            exit 0
          fi

          # Determine deployment status
          if [ "$JOB_STATUS" == "success" ] && [ "$RELEASE_SUCCESS" == "true" ]; then
            # Send release notes for successful deployment
            MESSAGE=$(cat release_notes.txt)
            
            # Add backup info to success message
            if [ -n "$BACKUP_FILENAME" ]; then
              BACKUP_INFO="

          💾 **Database Backup:** \`${BACKUP_FILENAME}\`
          📊 **Backup Location:** \`/opt/capital-tracker/backups/\`"
              MESSAGE="${MESSAGE}${BACKUP_INFO}"
            fi
          else
            # Send failure notification with rollback info
            DEPLOY_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
            COMMIT_SHORT=${GITHUB_SHA:0:7}
            
            if [ "$PREV_BACKEND_VER" != "none" ] && [ -n "$PREV_BACKEND_VER" ]; then
              ROLLBACK_INFO="

          🔄 **Automatic Rollback:** Attempted
          📦 **Previous Version:** \`${PREV_BACKEND_VER}\`
          💾 **Database Backup:** \`${BACKUP_FILENAME}\`
          📍 **Backup Location:** \`/opt/capital-tracker/backups/\`"
            else
              ROLLBACK_INFO="

          ⚠️ **No previous version to rollback**
          💾 **Database Backup:** \`${BACKUP_FILENAME}\` (preserved)"
            fi
            
            MESSAGE=$(cat <<EOF
          ❌ **Capital Tracker Deployment FAILED**

          📅 **Date:** ${DEPLOY_DATE}
          🔖 **Commit:** \`${COMMIT_SHORT}\`
          🔗 **Workflow:** [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ${ROLLBACK_INFO}

          **Status:** Deployment or health check failed. Database backup created. Please review the logs and verify service status.
          EOF
            )
          fi

          # Send message to Telegram
          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD" > /dev/null || echo "⚠️ Failed to send Telegram notification"
