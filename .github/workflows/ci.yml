name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.21.1"
  OPENSPEC_TELEMETRY: "0"

jobs:
  # ============================================
  # Backend Jobs
  # ============================================
  backend-check:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-check]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build artifacts
        run: test -d "dist" && echo "Build successful" || (echo "Build failed" && exit 1)

  # ============================================
  # Frontend Jobs
  # ============================================
  frontend-check:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-check]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://api.example.com

      - name: Verify build artifacts
        run: test -d "dist" && echo "Build successful" || (echo "Build failed" && exit 1)

  # ============================================
  # Docker Build Verification
  # ============================================
  docker-build:
    name: Release Images and Real Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend-build, frontend-build, backend-test, frontend-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify reviewed PostgreSQL source and pull Redis digest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pins = require('./deploy/manual-mvp-infrastructure-pins.json');
          const { validateInfrastructurePins } = require('./scripts/validate-manual-mvp-release.cjs');
          validateInfrastructurePins(pins);
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          if (createHash('sha256').update(readFileSync(pins.postgres.dockerfile)).digest('hex') !== pins.postgres.dockerfileSha256) throw new Error('PostgreSQL Dockerfile differs from reviewed source');
          NODE
          for name in redis; do
            digest=$(jq -er --arg name "$name" '.[$name].registryDigest' deploy/manual-mvp-infrastructure-pins.json)
            tag=$(jq -er --arg name "$name" '.[$name].tag' deploy/manual-mvp-infrastructure-pins.json)
            docker pull "$digest"
            docker tag "$digest" "$tag"
            test "$(docker image inspect "$tag" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$(docker image inspect "$digest" --format '{{.Id}}')"
          done
      - run: pnpm test:e2e
      - name: Scan the tested backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: capital-tracker-backend:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: backend-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the tested frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: capital-tracker-frontend:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: frontend-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the tested PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: capital-tracker-postgres:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: postgres-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the tested Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: redis:8.10.2-alpine3.23
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: redis-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Redact potentially sensitive scanner details
        id: redact-image-security
        if: always()
        run: node scripts/check-release-image-security.cjs --redact-only
      - name: Enforce exact-image high and critical security gate
        run: node scripts/check-release-image-security.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.redact-image-security.conclusion == 'success'
        with:
          name: release-image-security
          path: '*-image-security.json'
          retention-days: 7
      - name: Export the actual tested candidate images
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p candidate
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pins = require('./deploy/manual-mvp-infrastructure-pins.json');
          const manifest = { schemaVersion: 3, commit: process.env.CANDIDATE_COMMIT, runId: process.env.CANDIDATE_RUN_ID };
          for (const name of ['backend', 'frontend']) {
            const tag = `capital-tracker-${name}:acceptance`;
            manifest[name] = { tag, imageId: execFileSync('docker', ['image', 'inspect', tag, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim() };
          }
          manifest.infrastructure = {};
          for (const [name, pin] of Object.entries(pins)) {
            manifest.infrastructure[name] = { ...pin, imageId: execFileSync('docker', ['image', 'inspect', pin.tag, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim() };
          }
          const { validateLoadedImages } = require('./scripts/validate-manual-mvp-release.cjs');
          validateLoadedImages(manifest, tag => JSON.parse(execFileSync('docker', ['image', 'inspect', tag], { encoding: 'utf8' }))[0]);
          fs.writeFileSync('candidate/manifest.json', JSON.stringify(manifest));
          NODE
          node scripts/validate-manual-mvp-release.cjs candidate/manifest.json "$CANDIDATE_COMMIT" "$CANDIDATE_RUN_ID" deploy/manual-mvp-infrastructure-pins.json
          docker save capital-tracker-backend:acceptance capital-tracker-frontend:acceptance capital-tracker-postgres:acceptance redis:8.10.2-alpine3.23 | gzip > candidate/images.tar.gz
          sha256sum candidate/images.tar.gz > candidate/images.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-mvp-candidate
          path: candidate/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  spec-check:
    name: Specification and Engineering Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm specs:validate
      - run: pnpm test:engineering
      - run: pnpm test:security
      - name: Verify application ownership delegation as root in disposable fixtures
        run: sudo python3 -B -m unittest discover -s tests/security -p manual_mvp_dispatch_flow_test.py -k test_application_uid_is_accepted_only_at_delegated_paths

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:production

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - backend-test
      - backend-build
      - frontend-check
      - frontend-test
      - frontend-build
      - docker-build
      - spec-check
      - dependency-audit
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check every required result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node scripts/check-ci-results.cjs "$NEEDS_JSON"
          backend-check backend-test backend-build
          frontend-check frontend-test frontend-build
          docker-build spec-check dependency-audit
