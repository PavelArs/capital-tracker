name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Runs the full pull request suite, including release acceptance, for a chosen branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event keeps a manual run from cancelling the deployable push run of the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.10.0"

jobs:
  # Owner decision 2026-10-06: with the repository variable CI_SELF_HOSTED set to 'true' every
  # job below runs on the owner's self-hosted CI runners (label ci; ENG-008 keeps every job's
  # runs-on the same expression). Without it, or for a pull request from a fork or from
  # Dependabot, they run on GitHub's runners, so untrusted code never reaches the owner's
  # machine. The deploy runner (label deploy) never takes these jobs (docs/self-hosted-runner.md).
  # ============================================
  # Backend Jobs
  # ============================================
  backend-check:
    name: Backend Lint & Format
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm lint

  backend-test:
    name: Backend Tests
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-build:
    name: Backend Build
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    needs: [backend-check]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build artifacts
        run: test -d "dist" && echo "Build successful" || (echo "Build failed" && exit 1)

  # ============================================
  # Frontend Jobs
  # ============================================
  frontend-check:
    name: Frontend Lint & Format
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm lint

  frontend-test:
    name: Frontend Tests
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    needs: [frontend-check]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://api.example.com

      - name: Verify build artifacts
        run: test -d "dist" && echo "Build successful" || (echo "Build failed" && exit 1)

  # ============================================
  # Release Images, Critical Acceptance and Security
  # ============================================
  # Owner decision 2026-10-05: every check runs for pull requests (and manual dispatch); a
  # push to main only builds the release images, confirms the merged pull request passed
  # the full suite and exports the candidate the deploy promotes. The images are built
  # once, critical acceptance runs in parallel isolated shards and the final job merges
  # their receipts before scanning the same images.
  release-images:
    name: Build Release Images
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pull exact reviewed PostgreSQL and Redis images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pins = require('./deploy/manual-mvp-infrastructure-pins.json');
          const { validateInfrastructurePins } = require('./scripts/validate-manual-mvp-release.cjs');
          validateInfrastructurePins(pins);
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          if (createHash('sha256').update(readFileSync(pins.postgres.dockerfile)).digest('hex') !== pins.postgres.dockerfileSha256) throw new Error('PostgreSQL Dockerfile differs from reviewed source');
          NODE
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          postgres=$(jq -er '.postgres.registryDigest' deploy/manual-mvp-infrastructure-pins.json)
          postgres_tag=$(jq -er '.postgres.tag' deploy/manual-mvp-infrastructure-pins.json)
          postgres_origin=$(jq -er '.postgres.originRevision' deploy/manual-mvp-infrastructure-pins.json)
          docker pull "$postgres"
          docker tag "$postgres" "$postgres_tag"
          test "$(docker image inspect "$postgres_tag" --format '{{.Id}}')" = "$(docker image inspect "$postgres" --format '{{.Id}}')"
          test "$(docker image inspect "$postgres_tag" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$postgres_tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$postgres_origin"
          docker logout ghcr.io
          for name in redis; do
            digest=$(jq -er --arg name "$name" '.[$name].registryDigest' deploy/manual-mvp-infrastructure-pins.json)
            tag=$(jq -er --arg name "$name" '.[$name].tag' deploy/manual-mvp-infrastructure-pins.json)
            docker pull "$digest"
            docker tag "$digest" "$tag"
            test "$(docker image inspect "$tag" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$(docker image inspect "$digest" --format '{{.Id}}')"
          done
      - name: Build the backend and frontend acceptance images once
        run: node scripts/acceptance.mjs images --manifest release-images/manifest.json
      # The raw tar is about 700 MB and every shard and the scan job download it: zstd
      # shrinks it a few times for a couple of seconds of compression here.
      - name: Save the exact images for the acceptance shards
        run: |
          set -euo pipefail
          docker save capital-tracker-backend:acceptance capital-tracker-frontend:acceptance capital-tracker-postgres:acceptance redis:8.10.2-alpine3.23 | zstd -T0 -3 -q -o release-images/images.tar.zst
          (cd release-images && sha256sum images.tar.zst > images.tar.zst.sha256)
          # The owner's runners share the image store instead of the artifact storage quota; the
          # checksum still travels in the artifact, so the shards detect a changed archive.
          if [[ $RUNNER_ENVIRONMENT == self-hosted ]]; then
            mountpoint -q /srv/ci-images || { echo '::error::The shared image store /srv/ci-images is not mounted (docs/self-hosted-runner.md)'; exit 1; }
            install -d "/srv/ci-images/$GITHUB_RUN_ID"
            mv release-images/images.tar.zst "/srv/ci-images/$GITHUB_RUN_ID/images.tar.zst"
          fi
          ls -l release-images
      - name: Upload the exact images for the acceptance shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: release-images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # The receipt job needs only the manifest, not the images themselves.
      - name: Upload the image manifest for the acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images-manifest
          path: release-images/manifest.json
          if-no-files-found: error
          retention-days: 1
      # The deploy promotes exactly these images: they pass the acceptance shards and the scan on
      # main as well as on their pull request.
      - name: Export the release candidate images
        if: github.event_name == 'push'
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pins = require('./deploy/manual-mvp-infrastructure-pins.json');
          const manifest = { schemaVersion: 3, commit: process.env.CANDIDATE_COMMIT, runId: process.env.CANDIDATE_RUN_ID };
          for (const name of ['backend', 'frontend']) {
            const tag = `capital-tracker-${name}:acceptance`;
            manifest[name] = { tag, imageId: execFileSync('docker', ['image', 'inspect', tag, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim() };
          }
          manifest.infrastructure = {};
          for (const name of ['postgres', 'redis']) {
            const pin = pins[name];
            manifest.infrastructure[name] = { ...pin, imageId: execFileSync('docker', ['image', 'inspect', pin.tag, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim() };
          }
          const { validateLoadedImages } = require('./scripts/validate-manual-mvp-release.cjs');
          validateLoadedImages(manifest, tag => JSON.parse(execFileSync('docker', ['image', 'inspect', tag], { encoding: 'utf8' }))[0]);
          fs.writeFileSync('candidate/manifest.json', JSON.stringify(manifest));
          NODE
          node scripts/validate-manual-mvp-release.cjs candidate/manifest.json "$CANDIDATE_COMMIT" "$CANDIDATE_RUN_ID" deploy/manual-mvp-infrastructure-pins.json
          docker save capital-tracker-backend:acceptance capital-tracker-frontend:acceptance capital-tracker-postgres:acceptance redis:8.10.2-alpine3.23 | gzip > candidate/images.tar.gz
          sha256sum candidate/images.tar.gz > candidate/images.tar.gz.sha256
          # On the owner's runners the archive goes to the image store the deploy runner reads.
          if [[ $RUNNER_ENVIRONMENT == self-hosted ]]; then
            mountpoint -q /srv/ci-images || { echo '::error::The shared image store /srv/ci-images is not mounted (docs/self-hosted-runner.md)'; exit 1; }
            install -d "/srv/ci-images/$GITHUB_RUN_ID"
            mv candidate/images.tar.gz "/srv/ci-images/$GITHUB_RUN_ID/images.tar.gz"
          fi
      - name: Upload the release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-mvp-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  critical-acceptance:
    name: Critical acceptance (${{ matrix.shard }})
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    needs: [release-images]
    strategy:
      # Every shard reports its own result; the final job still requires all of them.
      fail-fast: false
      matrix:
        shard: [probes-1, probes-2, browser-1, browser-2, browser-3, browser-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        if: startsWith(matrix.shard, 'browser-')
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # A cached browser of the same Playwright version skips the download; the install
      # below still checks it and installs the system packages Chromium needs.
      - name: Restore the Playwright browser
        if: startsWith(matrix.shard, 'browser-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # GitHub's runners install Chromium's system packages with sudo; the self-hosted runner
      # has them preinstalled by its owner and gives the job no sudo.
      - name: Install the Playwright browser
        if: startsWith(matrix.shard, 'browser-')
        env:
          PLAYWRIGHT_DEPS: ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}
        run: pnpm exec playwright install $PLAYWRIGHT_DEPS chromium
      - name: Download the built release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release-images
      - name: Load and verify the exact built images
        run: |
          set -euo pipefail
          if [[ $RUNNER_ENVIRONMENT == self-hosted ]]; then ln -s "/srv/ci-images/$GITHUB_RUN_ID/images.tar.zst" release-images/images.tar.zst; fi
          (cd release-images && sha256sum -c images.tar.zst.sha256)
          zstd -dc < release-images/images.tar.zst | docker load
          rm release-images/images.tar.zst
          node scripts/acceptance-shards.cjs verify-images release-images/manifest.json "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Run critical real release acceptance
        id: critical-release-acceptance
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/acceptance.mjs critical --shard "$SHARD" --images release-images/manifest.json
      - name: Upload the critical acceptance shard receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-shard-receipt-${{ matrix.shard }}
          path: test-results/critical-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: synthetic-acceptance-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          # Diagnostics only, kept briefly to stay within the private repository's artifact
          # storage; a re-run of a failed shard may replace its earlier report.
          retention-days: 2
          overwrite: true

  # The scans need only the built images, so they run beside the shards rather than after them.
  image-security:
    name: Image Security Scan
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    needs: [release-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the built release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release-images
      - name: Load and verify the exact built images
        run: |
          set -euo pipefail
          if [[ $RUNNER_ENVIRONMENT == self-hosted ]]; then ln -s "/srv/ci-images/$GITHUB_RUN_ID/images.tar.zst" release-images/images.tar.zst; fi
          (cd release-images && sha256sum -c images.tar.zst.sha256)
          zstd -dc < release-images/images.tar.zst | docker load
          rm release-images/images.tar.zst
          node scripts/acceptance-shards.cjs verify-images release-images/manifest.json "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: capital-tracker-backend:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: backend-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: capital-tracker-frontend:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: frontend-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: capital-tracker-postgres:acceptance
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: postgres-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Scan the Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: redis:8.10.2-alpine3.23
          scanners: vuln,secret
          ignore-unfixed: false
          format: json
          output: redis-image-security.json
          exit-code: '0'
          timeout: 10m
      - name: Redact potentially sensitive scanner details
        id: redact-image-security
        if: always()
        run: node scripts/check-release-image-security.cjs --redact-only
      - name: Enforce exact-image high and critical security gate
        run: node scripts/check-release-image-security.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.redact-image-security.conclusion == 'success'
        with:
          name: release-image-security
          path: '*-image-security.json'
          retention-days: 7

  # Passes only when every shard passed on the built images and the scan job passed on them.
  docker-build:
    name: Acceptance Receipt and Image Security
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [release-images, critical-acceptance, image-security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the built image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images-manifest
          path: release-images
      - name: Download the critical acceptance shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: critical-shard-receipt-*
          path: shard-receipts
          merge-multiple: true
      - name: Merge verified critical acceptance shards
        id: critical-release-acceptance
        run: node scripts/acceptance-shards.cjs merge release-images/manifest.json shard-receipts "$GITHUB_SHA" "$GITHUB_RUN_ID" test-results/critical-release-acceptance.json
      - name: Verify critical acceptance receipt
        id: verify-critical-receipt
        run: node scripts/critical-release-profile.cjs verify test-results/critical-release-acceptance.json "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.verify-critical-receipt.conclusion == 'success'
        with:
          name: critical-release-acceptance
          path: test-results/critical-release-acceptance.json
          if-no-files-found: error
          retention-days: 7

  spec-check:
    name: Specification and Engineering Gates
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:engineering
      - run: pnpm test:security
      - name: Verify application ownership delegation as root in disposable fixtures
        run: sudo python3 -B -m unittest discover -s tests/security -p manual_mvp_dispatch_flow_test.py -k test_application_uid_is_accepted_only_at_delegated_paths

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    if: github.event_name != 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:production

  # Pull requests may read caches saved on main, but main runs no browser tests: download the
  # browser here, beside the image build, so the next pull requests' shards find it cached.
  # It gates nothing, so a cache outage cannot hold back a release.
  playwright-cache:
    name: Warm Playwright Browser Cache
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Download the Playwright browser
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

  # A push to main runs no tests of its own: it may release only a commit whose merged pull
  # request passed every job above, critical acceptance shards included, on its last head.
  merged-pr-ci:
    name: Merged Pull Request CI
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require a successful full pull request CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-merged-pr-ci.cjs

  ci-status:
    name: CI Status
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","ci"]') || 'ubuntu-latest' }}
    needs:
      - backend-check
      - backend-test
      - backend-build
      - frontend-check
      - frontend-test
      - frontend-build
      - release-images
      - critical-acceptance
      - image-security
      - docker-build
      - spec-check
      - dependency-audit
      - merged-pr-ci
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check every required result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          # A push to main builds the release, checks the images it built and confirms its pull
          # request passed the source checks; every other event must pass the full suite.
          if [[ "$CI_EVENT" == push ]]; then
            node scripts/check-ci-results.cjs "$NEEDS_JSON" release-images merged-pr-ci \
              critical-acceptance image-security docker-build
          else
            node scripts/check-ci-results.cjs "$NEEDS_JSON" \
              backend-check backend-test backend-build \
              frontend-check frontend-test frontend-build \
              spec-check dependency-audit \
              release-images critical-acceptance image-security docker-build
          fi
