name: Deploy Manual MVP
on:
  # A successful CI run for a push to main starts an approval-gated release.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run for this exact commit (ignored for inventory)
        required: true
        type: string
      mode:
        description: release (promote, preflight and deploy after environment approval), inventory (read-only), promote (publish tested images and receipt), preflight or deploy (owner-approved receipt)
        required: true
        default: inventory
        type: choice
        options: [release, inventory, promote, preflight, deploy]
      installation:
        description: Recorded in the promoted receipt; existing upgrade, first install after verified absence of application data, or completion of an interrupted activation
        required: true
        default: existing
        type: choice
        options: [existing, fresh, resume-fresh, resume-activation]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || (inputs.mode == 'inventory' && github.ref == 'refs/heads/release/manual-mvp' && github.sha == vars.MVP_PREFLIGHT_COMMIT)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds DEPLOY_DISPATCH_SSH_KEY. Its required reviewer is the release approval button;
    # without that protection rule an automatic release deploys without a click.
    environment: production
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'release' || inputs.mode }}
      RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
      RELEASE_INSTALLATION: ${{ github.event_name == 'workflow_run' && 'existing' || inputs.installation }}
    permissions:
      contents: read
      actions: read
      packages: write
    # Set only after the dispatcher accepted a deploy request; the tag job reads it.
    outputs:
      version: ${{ steps.deployed.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.10.0'
      - name: Validate trusted successful candidate provenance
        if: env.RELEASE_MODE != 'inventory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion=="success" and .status=="completed" and .event=="push" and .head_branch=="main" and .head_sha==$sha and .path==".github/workflows/ci.yml" and .head_repository.full_name==$repo' run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          node - <<'NODE'
          const jobs = JSON.parse(require('node:fs').readFileSync('jobs.json')).jobs;
          // Critical acceptance runs once per shard on the images built once; all must succeed.
          const shards = ['probes-1', 'probes-2', 'browser-1', 'browser-2', 'browser-3'].map(shard => `Critical acceptance (${shard})`);
          for (const name of ['Backend Lint & Format', 'Backend Tests', 'Backend Build', 'Frontend Lint & Format', 'Frontend Tests', 'Frontend Build', 'Build Release Images', ...shards, 'Release Images and Security', 'Specification and Engineering Gates', 'Production Dependency Audit', 'CI Status']) {
            if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error('Required candidate gate missing or unsuccessful');
          }
          const succeeded = (jobName, stepName) => jobs.find(job => job.name === jobName && job.conclusion === 'success').steps?.some(step => step.name === stepName && step.conclusion === 'success');
          for (const name of shards) {
            if (!succeeded(name, 'Run critical real release acceptance')) throw new Error('Critical real acceptance missing or unsuccessful');
          }
          for (const name of ['Merge verified critical acceptance shards', 'Verify critical acceptance receipt']) {
            if (!succeeded('Release Images and Security', name)) throw new Error('Critical real acceptance missing or unsuccessful');
          }
          NODE
          # Reject obsolete queued commits, even when their older CI succeeded.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n critical-release-acceptance -D acceptance
          node scripts/critical-release-profile.cjs verify acceptance/critical-release-acceptance.json "$GITHUB_SHA" "$RUN_ID"
      - name: Name the release version
        if: env.RELEASE_MODE != 'inventory'
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Readable, deterministic per commit: commit date in UTC plus the short SHA.
          version="v$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$GITHUB_SHA")-${GITHUB_SHA:0:7}"
          [[ "$version" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify the tested candidate
        if: env.RELEASE_MODE == 'promote' || env.RELEASE_MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n manual-mvp-candidate -D candidate
          node scripts/validate-manual-mvp-release.cjs candidate/manifest.json "$GITHUB_SHA" "$RUN_ID" deploy/manual-mvp-infrastructure-pins.json
          sha256sum -c candidate/images.tar.gz.sha256
      - name: Promote the identical tested images
        if: env.RELEASE_MODE == 'promote' || env.RELEASE_MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          gzip -dc candidate/images.tar.gz | docker load
          node - <<'NODE'
          const manifest = require('./candidate/manifest.json');
          const { execFileSync } = require('node:child_process');
          const { validateLoadedImages } = require('./scripts/validate-manual-mvp-release.cjs');
          validateLoadedImages(manifest, tag => JSON.parse(execFileSync('docker', ['image', 'inspect', tag], { encoding: 'utf8' }))[0]);
          NODE
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=${GITHUB_REPOSITORY_OWNER,,}
          promote=(backend frontend)
          if [[ $RELEASE_INSTALLATION != resume-fresh ]]; then promote+=(postgres); fi
          for name in "${promote[@]}"; do
            if [[ $name == postgres ]]; then
              tested=$(jq -r '.infrastructure.postgres.imageId' candidate/manifest.json)
              tag=$(jq -r '.infrastructure.postgres.tag' candidate/manifest.json)
            else
              tested=$(jq -r ".$name.imageId" candidate/manifest.json)
              tag=$(jq -r ".$name.tag" candidate/manifest.json)
            fi
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$tested"
            destination="ghcr.io/$owner/capital-tracker-$name:$GITHUB_SHA"
            docker tag "$tested" "$destination"
            docker push "$destination"
            digest=$(docker image inspect "$destination" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ ^ghcr\.io/[a-z0-9_-]+/capital-tracker-(backend|frontend|postgres)@sha256:[a-f0-9]{64}$ ]]
            echo "RELEASE_${name^^}=$digest" >> "$GITHUB_ENV"
            # Same tested image, readable name; the receipt keeps the digest above.
            docker tag "$tested" "ghcr.io/$owner/capital-tracker-$name:$RELEASE_VERSION"
            docker push "ghcr.io/$owner/capital-tracker-$name:$RELEASE_VERSION"
          done
          if [[ $RELEASE_INSTALLATION == resume-fresh ]]; then
            old_postgres=$(jq -er '.postgres.registryDigest' deploy/manual-mvp-infrastructure-pins.json)
            tested_postgres=$(jq -er '.infrastructure.postgres.imageId' candidate/manifest.json)
            old_tag=$(jq -er '.infrastructure.postgres.tag' candidate/manifest.json)
            test "$(docker image inspect "$old_tag" --format '{{.Id}}')" = "$tested_postgres"
            echo "RELEASE_POSTGRES=$old_postgres" >> "$GITHUB_ENV"
          fi
          docker logout ghcr.io
      - name: Write the release receipt for owner approval
        if: env.RELEASE_MODE == 'promote' || env.RELEASE_MODE == 'release'
        run: |
          set -euo pipefail
          mkdir receipt
          python3 scripts/manual-mvp-receipt.py "$GITHUB_SHA" "$RUN_ID" "$RELEASE_INSTALLATION" "$RELEASE_BACKEND" "$RELEASE_FRONTEND" "$RELEASE_POSTGRES" "receipt/$GITHUB_SHA-$RUN_ID.json"
          # The receipt holds only public commit/run/digest/hash identities for owner review.
          { echo '### Release receipt awaiting owner approval'; echo '```json'; cat "receipt/$GITHUB_SHA-$RUN_ID.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release receipt
        if: env.RELEASE_MODE == 'promote' || env.RELEASE_MODE == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-mvp-release-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 30
      - name: Configure restricted release SSH with pinned identity
        if: env.RELEASE_MODE != 'promote'
        env:
          DEPLOY_DISPATCH_SSH_KEY: ${{ secrets.DEPLOY_DISPATCH_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_DISPATCH_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_DISPATCH_SSH_KEY" > ~/.ssh/release-key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/release-key
      - name: Send a data-only request to the root-owned release dispatcher
        if: env.RELEASE_MODE != 'promote'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DISPATCH_USER: ${{ vars.DEPLOY_DISPATCH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$DEPLOY_DISPATCH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_MODE" =~ ^(inventory|preflight|deploy|release)$ ]]
          # Inventory is not bound to a candidate; it only names this workflow run.
          if [[ "$RELEASE_MODE" == inventory ]]; then RUN_ID=$GITHUB_RUN_ID; fi
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          port=${DEPLOY_SSH_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ && "$port" -ge 1 && "$port" -le 65535 ]]
          # The forced command ignores any remote command; the request is data on stdin.
          dispatch() {
            ssh -T -p "$port" -i ~/.ssh/release-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              "$DEPLOY_DISPATCH_USER@$DEPLOY_HOST"
          }
          if [[ "$RELEASE_MODE" == release ]]; then
            # The environment approval authorizes the receipt promoted above; deploy follows a passed preflight.
            receipt="receipt/$GITHUB_SHA-$RUN_ID.json"
            for operation in preflight deploy; do
              jq -c --arg operation "$operation" --arg commit "$GITHUB_SHA" --arg runId "$RUN_ID" \
                '{version: 2, operation: $operation, commit: $commit, runId: $runId, receipt: .}' "$receipt" | dispatch
            done
          else
            jq -cn --arg operation "$RELEASE_MODE" --arg commit "$GITHUB_SHA" --arg runId "$RUN_ID" \
              '{version: 1, operation: $operation, commit: $commit, runId: $runId}' | dispatch
          fi
      - name: Report the deployed release version
        id: deployed
        if: env.RELEASE_MODE == 'release' || env.RELEASE_MODE == 'deploy'
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/release-key
  # Marks the release now running. Separate from deploy so the job holding the
  # dispatcher key never gets contents: write; this one holds no secret.
  tag:
    needs: deploy
    if: needs.deploy.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the deployed commit with its release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ && "${VERSION: -7}" == "${GITHUB_SHA:0:7}" ]]
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" | jq -r --arg ref "refs/tags/$VERSION" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          else
            # A re-run may meet its own tag; never move a tag to another commit.
            test "$existing" = "$GITHUB_SHA"
          fi
          echo "Deployed \`$VERSION\` ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
