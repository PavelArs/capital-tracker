name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Skip database backup"
        required: false
        default: false
        type: boolean
      version_bump:
        description: "Version bump type (auto, major, minor, patch)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  YC_REGISTRY: registry.yandexcloud.net
  BACKEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-backend
  FRONTEND_IMAGE: registry.yandexcloud.net/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-frontend
  HEALTH_CHECK_TIMEOUT: 30
  HEALTH_CHECK_INTERVAL: 5
  HEALTH_CHECK_RETRIES: 3

jobs:
  # ============================================
  # Version Calculation
  # ============================================
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      commit_short: ${{ steps.version.outputs.commit_short }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      commit_count: ${{ steps.changelog.outputs.commit_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        run: |
          COMMIT_SHORT=${GITHUB_SHA:0:7}
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT

          # Get the latest version tag
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
            echo "No previous version found, starting from v0.0.0"
          fi

          echo "previous_version=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "📦 Previous version: $LATEST_TAG"

          # Parse version components
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Determine bump type
          BUMP_TYPE="${{ github.event.inputs.version_bump || 'auto' }}"

          if [ "$BUMP_TYPE" == "auto" ]; then
            # Auto-detect from commit messages since last tag
            if [ "$LATEST_TAG" != "v0.0.0" ]; then
              COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
            else
              COMMITS=$(git log --pretty=format:"%s" -20 2>/dev/null || echo "")
            fi
            
            if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?!:|BREAKING CHANGE"; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?:"; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          # Calculate new version
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🚀 New version: $NEW_VERSION (bump: $BUMP_TYPE)"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.version.outputs.previous_version }}"

          if [ "$LATEST_TAG" != "v0.0.0" ] && git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"• %s \`%h\`" 2>/dev/null | head -20)
            COMMIT_COUNT=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || echo "0")
          else
            COMMITS=$(git log --pretty=format:"• %s \`%h\`" -20 2>/dev/null)
            COMMIT_COUNT=$(git rev-list HEAD --count 2>/dev/null || echo "0")
          fi

          # Escape for GitHub output
          CHANGELOG=$(echo "$COMMITS" | head -15)

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

  # ============================================
  # Build Docker Images
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: version

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    outputs:
      backend_image: ${{ steps.output.outputs.backend_image }}
      frontend_image: ${{ steps.output.outputs.frontend_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.YC_REGISTRY }}
          username: oauth
          password: ${{ secrets.YC_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:${{ needs.version.outputs.commit_short }}
            ${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:latest
          build-args: ${{ matrix.service == 'frontend' && format('VITE_API_URL={0}', secrets.VITE_API_URL) || '' }}
          cache-from: type=registry,ref=${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:buildcache,mode=max
          provenance: false

      - name: Set output
        id: output
        run: |
          IMAGE="${{ env.YC_REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/capital-tracker-${{ matrix.service }}:${{ needs.version.outputs.version }}"
          echo "${{ matrix.service }}_image=$IMAGE" >> $GITHUB_OUTPUT

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write

    outputs:
      backup_filename: ${{ steps.backup-db.outputs.backup-filename }}
      previous_backend: ${{ steps.get-versions.outputs.current-backend }}
      previous_frontend: ${{ steps.get-versions.outputs.current-frontend }}
      deployed_version: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Get current running versions
        id: get-versions
        run: |
          CURRENT_BACKEND=$(ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
            "docker inspect capital-tracker-backend-1 --format='{{.Config.Image}}' 2>/dev/null || \
             docker inspect capital_tracker_backend --format='{{.Config.Image}}' 2>/dev/null || \
             echo 'none'")
          CURRENT_FRONTEND=$(ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} \
            "docker inspect capital-tracker-frontend-1 --format='{{.Config.Image}}' 2>/dev/null || \
             docker inspect capital_tracker_frontend --format='{{.Config.Image}}' 2>/dev/null || \
             echo 'none'")

          {
            echo "current-backend<<EOF"
            echo "$CURRENT_BACKEND"
            echo "EOF"
            echo "current-frontend<<EOF"
            echo "$CURRENT_FRONTEND"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "📦 Current Backend: $CURRENT_BACKEND"
          echo "📦 Current Frontend: $CURRENT_FRONTEND"

      - name: Create database backup
        id: backup-db
        if: github.event.inputs.skip_backup != 'true'
        run: |
          BACKUP_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILENAME="capital-tracker-backup-${BACKUP_TIMESTAMP}.sql.gz"

          echo "💾 Creating database backup: $BACKUP_FILENAME"

          ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} "BACKUP_FILENAME=$BACKUP_FILENAME bash -s" << 'BACKUP_SCRIPT'
            set -e
            cd /opt/capital-tracker

            mkdir -p backups

            DB_NAME=$(grep DB_NAME .env 2>/dev/null | cut -d '=' -f2 || echo 'capital_tracker')
            DB_USER=$(grep DB_USERNAME .env 2>/dev/null | cut -d '=' -f2 || echo 'postgres')

            POSTGRES_CONTAINER=$(docker compose ps -q postgres 2>/dev/null || docker-compose ps -q postgres 2>/dev/null)

            if [ -z "$POSTGRES_CONTAINER" ]; then
              POSTGRES_CONTAINER=$(docker ps -q -f name=capital_tracker_db || docker ps -q -f name=capital-tracker-postgres)
            fi

            if [ -z "$POSTGRES_CONTAINER" ]; then
              echo "❌ Postgres container not found!"
              exit 1
            fi

            docker exec $POSTGRES_CONTAINER pg_dump -U $DB_USER -d $DB_NAME | gzip > "backups/$BACKUP_FILENAME"

            ls -t backups/capital-tracker-backup-*.sql.gz | tail -n +11 | xargs -r rm
            echo "✅ Backup created successfully"
          BACKUP_SCRIPT

          {
            echo "backup-filename<<EOF"
            echo "$BACKUP_FILENAME"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Copy docker-compose.yml
        run: |
          scp docker-compose.yml ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:/opt/capital-tracker/docker-compose.yml

      - name: Deploy application
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker

            echo "$YC_TOKEN" | docker login --username oauth --password-stdin registry.yandexcloud.net

            echo "📥 Pulling latest images..."
            docker compose pull

            echo "🔄 Restarting services..."
            docker compose down
            docker compose up -d

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "📊 Service status:"
            docker compose ps
          EOF

      - name: Wait for services to initialize
        run: |
          echo "⏳ Waiting 10 seconds for services to initialize..."
          sleep 10

      - name: Health check
        id: health-check
        run: |
          MAX_ATTEMPTS=$(( ${{ env.HEALTH_CHECK_TIMEOUT }} / ${{ env.HEALTH_CHECK_INTERVAL }} ))
          ATTEMPT=0

          echo "🏥 Starting health checks (timeout: ${{ env.HEALTH_CHECK_TIMEOUT }}s)"

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} "curl -sf http://localhost:3000/health" >/dev/null 2>&1; then
              echo "✅ Health check passed"
              echo "health-status=passed" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Retrying in ${{ env.HEALTH_CHECK_INTERVAL }}s..."
              sleep ${{ env.HEALTH_CHECK_INTERVAL }}
            fi
          done

          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          echo "health-status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Create version tags
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          # Create version tag
          git tag -a "$VERSION" -m "Release $VERSION

          Backend: ${{ env.BACKEND_IMAGE }}:$VERSION
          Frontend: ${{ env.FRONTEND_IMAGE }}:$VERSION
          Commit: ${{ needs.version.outputs.commit_short }}"

          git push origin "$VERSION"

          echo "✅ Created tag: $VERSION"

  # ============================================
  # Rollback on Failure
  # ============================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [version, deploy]
    if: failure() && needs.deploy.outputs.previous_backend != 'none'

    outputs:
      rollback_status: ${{ steps.rollback-health.outputs.status }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback deployment
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          PREV_BACKEND: ${{ needs.deploy.outputs.previous_backend }}
          PREV_FRONTEND: ${{ needs.deploy.outputs.previous_frontend }}
        run: |
          echo "🔄 INITIATING ROLLBACK..."
          echo "Backend: $PREV_BACKEND"
          echo "Frontend: $PREV_FRONTEND"

          ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << EOF
            set -e
            cd /opt/capital-tracker

            echo "$YC_TOKEN" | docker login --username oauth --password-stdin registry.yandexcloud.net

            if [ -n "$PREV_BACKEND" ] && [ "$PREV_BACKEND" != "none" ]; then
              echo "📥 Pulling previous backend: $PREV_BACKEND"
              docker pull "$PREV_BACKEND" || true
              docker tag "$PREV_BACKEND" "${{ env.BACKEND_IMAGE }}:latest" || true
            fi

            if [ -n "$PREV_FRONTEND" ] && [ "$PREV_FRONTEND" != "none" ]; then
              echo "📥 Pulling previous frontend: $PREV_FRONTEND"
              docker pull "$PREV_FRONTEND" || true
              docker tag "$PREV_FRONTEND" "${{ env.FRONTEND_IMAGE }}:latest" || true
            fi

            docker compose down
            docker compose up -d

            echo "⏳ Waiting for rollback to complete..."
            sleep 20
          EOF

      - name: Verify rollback health
        id: rollback-health
        run: |
          ATTEMPTS=0
          MAX_ATTEMPTS=${{ env.HEALTH_CHECK_RETRIES }}

          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Verifying rollback health (attempt $ATTEMPTS/$MAX_ATTEMPTS)..."

            if ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} "curl -sf http://localhost:3000/health" >/dev/null 2>&1; then
              echo "✅ Rollback successful - service is healthy"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; then
              sleep 10
            fi
          done

          echo "❌ Rollback health check failed - manual intervention required!"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

  # ============================================
  # Cleanup
  # ============================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.YC_VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.YC_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Cleanup old images and backups
        run: |
          echo "🧹 Cleaning up old Docker images and backups..."
          ssh ${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }} << 'EOF'
            docker image prune -a -f --filter "until=72h" || true

            cd /opt/capital-tracker/backups 2>/dev/null || exit 0
            BACKUP_COUNT=$(ls -1 capital-tracker-backup-*.sql.gz 2>/dev/null | wc -l)
            echo "📊 Total backups: $BACKUP_COUNT"

            ls -t capital-tracker-backup-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm
            echo "✅ Cleanup complete"
          EOF

  # ============================================
  # Notifications
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [version, deploy, rollback]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          ROLLBACK_STATUS: ${{ needs.rollback.result }}
          VERSION: ${{ needs.version.outputs.version }}
          PREV_VERSION: ${{ needs.version.outputs.previous_version }}
          COMMIT_SHORT: ${{ needs.version.outputs.commit_short }}
          COMMIT_COUNT: ${{ needs.version.outputs.commit_count }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          BACKUP_FILENAME: ${{ needs.deploy.outputs.backup_filename }}
          PREV_BACKEND: ${{ needs.deploy.outputs.previous_backend }}
          PREV_FRONTEND: ${{ needs.deploy.outputs.previous_frontend }}
          BACKEND_IMG: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMG: ${{ env.FRONTEND_IMAGE }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification"
            exit 0
          fi

          DEPLOY_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          REPO_URL="https://github.com/${REPO}"

          if [ "$DEPLOY_STATUS" == "success" ]; then
            {
              echo "🚀 *Capital Tracker Deployment*"
              echo ""
              echo "📅 *Date:* ${DEPLOY_DATE}"
              echo "🏷️ *Version:* \`${VERSION}\`"
              echo "🔖 *Commit:* \`${COMMIT_SHORT}\`"
              echo "📝 *Changes:* ${COMMIT_COUNT} commit(s)"
              echo ""
              echo "📦 *Docker Images:*"
              echo "• Backend: \`${BACKEND_IMG}:${VERSION}\`"
              echo "• Frontend: \`${FRONTEND_IMG}:${VERSION}\`"
              echo ""
              echo "${CHANGELOG}"
              echo ""
              echo "---"
              echo "🔗 *Links:*"
              echo "• [Full Changelog](${REPO_URL}/compare/${PREV_VERSION}...${VERSION})"
              echo "• [Commit Details](${REPO_URL}/commit/${SHA})"
              echo ""
              echo "💾 *Backup:* \`${BACKUP_FILENAME}\`"
              echo "📍 *Backup Location:* \`/opt/capital-tracker/backups/\`"
              echo ""
              echo "✅ *Status:* Deployed and health check passed"
            } > /tmp/message.txt
          else
            if [ "$ROLLBACK_STATUS" == "success" ]; then
              ROLLBACK_MSG="🔄 *Automatic Rollback:* Completed successfully"
            elif [ "$ROLLBACK_STATUS" == "failure" ]; then
              ROLLBACK_MSG="⚠️ *Automatic Rollback:* Failed - manual intervention required!"
            else
              ROLLBACK_MSG="🔄 *Automatic Rollback:* Attempted"
            fi

            {
              echo "❌ *Capital Tracker Deployment FAILED*"
              echo ""
              echo "📅 *Date:* ${DEPLOY_DATE}"
              echo "🏷️ *Version:* \`${VERSION}\` (attempted)"
              echo "🔖 *Commit:* \`${COMMIT_SHORT}\`"
              echo "🔗 *Workflow:* [View Details](${REPO_URL}/actions/runs/${RUN_ID})"
              echo ""
              echo "${ROLLBACK_MSG}"
              echo "📦 *Previous Backend:* \`${PREV_BACKEND}\`"
              echo "📦 *Previous Frontend:* \`${PREV_FRONTEND}\`"
              echo ""
              echo "💾 *Database Backup:* \`${BACKUP_FILENAME}\`"
              echo "📍 *Backup Location:* \`/opt/capital-tracker/backups/\`"
              echo ""
              echo "*Status:* Deployment or health check failed. Database backup created. Please review the logs and verify service status."
            } > /tmp/message.txt
          fi

          MESSAGE=$(cat /tmp/message.txt)

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Failed to send Telegram notification"
