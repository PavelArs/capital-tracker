name: Deploy Manual MVP
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run for this exact commit
        required: true
        type: string
      mode:
        description: Read-only preflight or verified production deployment
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy]
      installation:
        description: Existing upgrade or first install after verified absence of application data
        required: true
        default: existing
        type: choice
        options: [existing, fresh]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || (inputs.mode == 'preflight' && github.ref == 'refs/heads/release/manual-mvp' && github.sha == vars.MVP_PREFLIGHT_COMMIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
      - name: Validate trusted successful candidate provenance
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion=="success" and .status=="completed" and .event=="push" and .head_branch=="main" and .head_sha==$sha and .path==".github/workflows/ci.yml" and .head_repository.full_name==$repo' run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          node - <<'NODE'
          const jobs = JSON.parse(require('node:fs').readFileSync('jobs.json')).jobs;
          for (const name of ['Backend Lint & Format', 'Backend Tests', 'Backend Build', 'Frontend Lint & Format', 'Frontend Tests', 'Frontend Build', 'Release Images and Real Acceptance', 'Specification and Engineering Gates', 'Production Dependency Audit', 'CI Status']) {
            if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error('Required candidate gate missing or unsuccessful');
          }
          NODE
          # Reject obsolete queued commits, even when their older CI succeeded.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n manual-mvp-candidate -D candidate
          node scripts/validate-manual-mvp-release.cjs candidate/manifest.json "$GITHUB_SHA" "$RUN_ID"
          sha256sum -c candidate/images.tar.gz.sha256
      - name: Promote the identical tested images
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gzip -dc candidate/images.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for name in backend frontend; do
            tested=$(jq -r ".$name.imageId" candidate/manifest.json)
            tag=$(jq -r ".$name.tag" candidate/manifest.json)
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$tested"
            destination="ghcr.io/$owner/capital-tracker-$name:$GITHUB_SHA"
            docker tag "$tested" "$destination"
            docker push "$destination"
            digest=$(docker image inspect "$destination" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ ^ghcr.io/.*@sha256:[a-f0-9]{64}$ ]]
            echo "RELEASE_${name^^}=$digest" >> "$GITHUB_ENV"
          done
      - name: Configure existing deployment SSH with pinned identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/release-key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/release-key
      - name: Locked server preflight and release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_INSTALLATION: ${{ inputs.installation }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$RELEASE_MODE" == preflight || "$RELEASE_MODE" == deploy ]]
          [[ "$RELEASE_INSTALLATION" == existing || "$RELEASE_INSTALLATION" == fresh ]]
          target="$DEPLOY_USER@$DEPLOY_HOST"
          port=${DEPLOY_SSH_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ && "$port" -ge 1 && "$port" -le 65535 ]]
          options=(-p "$port" -i ~/.ssh/release-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          if [[ "$RELEASE_MODE" == preflight ]]; then
            ssh "${options[@]}" "$target" 'bash -s' < scripts/manual-mvp-inventory.sh
            exit 0
          fi
          remote_dir="/tmp/capital-release-$GITHUB_RUN_ID"
          ssh "${options[@]}" "$target" "umask 077; mkdir '$remote_dir'"
          scp -P "$port" -i ~/.ssh/release-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes scripts/manual-mvp-release.sh docker-compose.yml "$target:$remote_dir/"
          ssh "${options[@]}" "$target" "RELEASE_INSTALLATION='$RELEASE_INSTALLATION' RELEASE_COMPOSE_FILE='$remote_dir/docker-compose.yml' bash '$remote_dir/manual-mvp-release.sh' '$RELEASE_MODE' '$GITHUB_SHA' '${RELEASE_BACKEND:-}' '${RELEASE_FRONTEND:-}'"
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/release-key
