name: Deploy Manual MVP
on:
  # A successful CI run for a push to main starts an approval-gated release.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run for this exact commit
        required: true
        type: string
      mode:
        description: release (promote, then the server agent releases after environment approval) or promote (publish the tested images and receipt only, for example for a new server)
        required: true
        default: promote
        type: choice
        options: [release, promote]
      installation:
        description: Recorded in the promoted receipt. The server agent releases only existing; a fresh or resume receipt is for a new server (docs/manual-mvp-release.md)
        required: true
        default: existing
        type: choice
        options: [existing, fresh, resume-fresh, resume-activation]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # For workflow_run, github.sha is the current main head: a green CI run of an older
    # commit (e.g. one that finished after a newer push) is skipped instead of asking
    # for an approval that provenance would refuse anyway.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Pinned with ci.yml, which builds the candidate: image ids differ between the Docker of
    # ubuntu-24.04 and ubuntu-26.04 (what ubuntu-latest became on 2026-11-05), so a candidate
    # built on one fails the identity check when loaded on the other.
    runs-on: ubuntu-24.04
    # A release waits for one pass of the server agent (docs/pull-release-agent.md); a
    # promotion alone keeps the short job.
    timeout-minutes: ${{ (github.event_name == 'workflow_run' || inputs.mode == 'release') && 180 || 30 }}
    # Its required reviewer is the release approval button: the server agent releases only a
    # run the owner approved here. Without that protection rule a release deploys without a click.
    environment: production
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'release' || inputs.mode }}
      RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
      RELEASE_INSTALLATION: ${{ github.event_name == 'workflow_run' && 'existing' || inputs.installation }}
    permissions:
      contents: read
      actions: read
      packages: write
      # Only to read the server agent's production-release status.
      statuses: read
    # Set only after the server agent verified the release; the tag job reads it.
    outputs:
      version: ${{ steps.deployed.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Check the release request
        run: |
          set -euo pipefail
          [[ $RELEASE_MODE == release || $RELEASE_MODE == promote ]]
          # The server agent (docs/pull-release-agent.md) releases only an existing
          # installation. A receipt for a new server is promoted, then installed by hand.
          if [[ $RELEASE_MODE == release && $RELEASE_INSTALLATION != existing ]]; then
            echo '::error::The server agent releases only an existing installation; promote this receipt instead and install it on the new server (docs/manual-mvp-release.md).'
            exit 1
          fi
      - name: Validate trusted successful candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion=="success" and .status=="completed" and .event=="push" and .head_branch=="main" and .head_sha==$sha and .path==".github/workflows/ci.yml" and .head_repository.full_name==$repo' run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          node - <<'NODE'
          const jobs = JSON.parse(require('node:fs').readFileSync('jobs.json')).jobs;
          // Main runs no tests: it builds the candidate after confirming that the merged pull
          // request passed the full suite (lint, unit, probes, every acceptance shard, scans).
          for (const name of ['Build Release Images', 'Merged Pull Request CI', 'CI Status']) {
            if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error('Required candidate gate missing or unsuccessful');
          }
          const succeeded = (jobName, stepName) => jobs.find(job => job.name === jobName && job.conclusion === 'success').steps?.some(step => step.name === stepName && step.conclusion === 'success');
          if (!succeeded('Merged Pull Request CI', 'Require a successful full pull request CI run')) throw new Error('Pull request acceptance evidence missing or unsuccessful');
          if (!succeeded('Build Release Images', 'Export the release candidate images')) throw new Error('Release candidate export missing or unsuccessful');
          NODE
          # Reject obsolete queued commits, even when their older CI succeeded.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Name the release version
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Readable, deterministic per commit: commit date in UTC plus the short SHA.
          version="v$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$GITHUB_SHA")-${GITHUB_SHA:0:7}"
          [[ "$version" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify the tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n manual-mvp-candidate -D candidate
          node scripts/validate-manual-mvp-release.cjs candidate/manifest.json "$GITHUB_SHA" "$RUN_ID" deploy/manual-mvp-infrastructure-pins.json
          sha256sum -c candidate/images.tar.gz.sha256
      - name: Promote the identical tested images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          # CI tests the official PostgreSQL image (owner decision 2026-10-24); resume-fresh would
          # release the derived image of the interrupted first install, which nothing tests now.
          [[ $RELEASE_INSTALLATION != resume-fresh ]] || { echo 'resume-fresh is retired: CI no longer tests its PostgreSQL image' >&2; exit 1; }
          gzip -dc candidate/images.tar.gz | docker load
          node - <<'NODE'
          const manifest = require('./candidate/manifest.json');
          const { execFileSync } = require('node:child_process');
          const { validateLoadedImages } = require('./scripts/validate-manual-mvp-release.cjs');
          validateLoadedImages(manifest, tag => JSON.parse(execFileSync('docker', ['image', 'inspect', tag], { encoding: 'utf8' }))[0]);
          NODE
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=${GITHUB_REPOSITORY_OWNER,,}
          promote=(backend frontend)
          if [[ $RELEASE_INSTALLATION != resume-fresh ]]; then promote+=(postgres); fi
          for name in "${promote[@]}"; do
            if [[ $name == postgres ]]; then
              tested=$(jq -r '.infrastructure.postgres.imageId' candidate/manifest.json)
              tag=$(jq -r '.infrastructure.postgres.tag' candidate/manifest.json)
            else
              tested=$(jq -r ".$name.imageId" candidate/manifest.json)
              tag=$(jq -r ".$name.tag" candidate/manifest.json)
            fi
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$tested"
            destination="ghcr.io/$owner/capital-tracker-$name:$GITHUB_SHA"
            docker tag "$tested" "$destination"
            docker push "$destination"
            digest=$(docker image inspect "$destination" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ ^ghcr\.io/[a-z0-9_-]+/capital-tracker-(backend|frontend|postgres)@sha256:[a-f0-9]{64}$ ]]
            echo "RELEASE_${name^^}=$digest" >> "$GITHUB_ENV"
            # Same tested image, readable name; the receipt keeps the digest above.
            docker tag "$tested" "ghcr.io/$owner/capital-tracker-$name:$RELEASE_VERSION"
            docker push "ghcr.io/$owner/capital-tracker-$name:$RELEASE_VERSION"
          done
          if [[ $RELEASE_INSTALLATION == resume-fresh ]]; then
            old_postgres=$(jq -er '.postgres.registryDigest' deploy/manual-mvp-infrastructure-pins.json)
            tested_postgres=$(jq -er '.infrastructure.postgres.imageId' candidate/manifest.json)
            old_tag=$(jq -er '.infrastructure.postgres.tag' candidate/manifest.json)
            test "$(docker image inspect "$old_tag" --format '{{.Id}}')" = "$tested_postgres"
            echo "RELEASE_POSTGRES=$old_postgres" >> "$GITHUB_ENV"
          fi
          docker logout ghcr.io
      - name: Write the release receipt for owner approval
        run: |
          set -euo pipefail
          mkdir receipt
          python3 scripts/manual-mvp-receipt.py "$GITHUB_SHA" "$RUN_ID" "$RELEASE_INSTALLATION" "$RELEASE_BACKEND" "$RELEASE_FRONTEND" "$RELEASE_POSTGRES" "receipt/$GITHUB_SHA-$RUN_ID.json"
          # The receipt holds only public commit/run/digest/hash identities for owner review.
          { echo '### Release receipt awaiting owner approval'; echo '```json'; cat "receipt/$GITHUB_SHA-$RUN_ID.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-mvp-release-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 30
      # The agent takes a request only from this job, which runs after the approval, and
      # only from the run attempt that uploaded it.
      - name: Hand the release to the server agent
        if: env.RELEASE_MODE == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release-request
          path: receipt/
          if-no-files-found: error
          retention-days: 1
      - name: Wait for the server agent's release
        if: env.RELEASE_MODE == 'release'
        # Longer than one agent pass: its unit stops it after 2 hours, plus 15 for the rollback.
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The agent names this exact attempt in its status and posts it with the owner's
          # token, so another attempt's result or a status from a workflow never counts.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          attempt_url="$run_url/attempts/$GITHUB_RUN_ATTEMPT"
          echo "Waiting for the production-release status of $attempt_url"
          polls=0
          last=waiting
          while :; do
            result=waiting
            if statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100"); then
              # Newest first: the first match is the agent's latest word on this attempt. A
              # status for this run without an attempt comes from an agent older than this job.
              result=$(jq -r --arg url "$attempt_url" --arg run "$run_url" --arg owner "$GITHUB_REPOSITORY_OWNER" '
                map(select(.context == "production-release" and .creator.login == $owner))
                | (map(select(.target_url == $url)) | first) as $own
                | if $own != null then $own.state + " " + ($own.description // "")
                  elif any(.[]; .target_url == $run) then "outdated"
                  else "waiting" end' <<<"$statuses") || result=waiting
            fi
            case $result in
              success*) echo "Server release succeeded: ${result#success }"; exit 0 ;;
              failure* | error*) echo "::error::Server release failed: ${result#* }"; exit 1 ;;
              outdated)
                echo "::error::The server agent is out of date: its status for this run names no attempt, so this job cannot tell its outcome. It may still be releasing; check journalctl -u capital-tracker-deploy-agent on the server, then run scripts/deploy-agent-install.sh update from this commit (docs/pull-release-agent.md)."
                exit 1 ;;
            esac
            if [[ $result != waiting && $result != "$last" ]]; then
              echo "Server release ${result%% *}: ${result#* }"
              last=$result
            fi
            polls=$((polls + 1))
            # The agent polls every minute and reports the start at once; its start report is
            # best effort, so silence is only a warning.
            if ((polls == 30)) && [[ $last == waiting ]]; then
              echo "::warning::No status from the server agent after 10 minutes. Check that it is installed and active: scripts/deploy-agent-install.sh active (docs/pull-release-agent.md)."
            fi
            sleep 20
          done
      - name: Report the deployed release version
        id: deployed
        if: env.RELEASE_MODE == 'release'
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  # Marks the release now running. Separate from deploy so the job that publishes images
  # and hands the release to the server never gets contents: write.
  tag:
    needs: deploy
    if: needs.deploy.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the deployed commit with its release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ && "${VERSION: -7}" == "${GITHUB_SHA:0:7}" ]]
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" | jq -r --arg ref "refs/tags/$VERSION" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          else
            # A re-run may meet its own tag; never move a tag to another commit.
            test "$existing" = "$GITHUB_SHA"
          fi
          echo "Deployed \`$VERSION\` ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
