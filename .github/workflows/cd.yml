name: Read-only Deployment Inventory
# Legacy automatic production deployment is contained. This workflow cannot deploy.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing deployment identity with pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          port=${DEPLOY_SSH_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ && "$port" -ge 1 && "$port" -le 65535 ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inventory-key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/inventory-key ~/.ssh/known_hosts
          ssh -p "$port" -i ~/.ssh/inventory-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'INVENTORY'
          set -Eeuo pipefail
          printf 'deployment_user=%s\n' "$(id -un)"
          printf 'project_directory_writable=%s\n' "$(test -w /opt/capital-tracker && echo yes || echo no)"
          printf 'existing_env_readable=%s\n' "$(test -r /opt/capital-tracker/.env && echo yes || echo no)"
          printf 'noninteractive_sudo=%s\n' "$(sudo -n true >/dev/null 2>&1 && echo yes || echo no)"
          if [[ -r /opt/capital-tracker/.env ]]; then
            echo 'existing_setting_names:'
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' /opt/capital-tracker/.env | sort -u
          fi
          if docker info >/dev/null 2>&1; then
            echo 'docker_access=yes'
            containers=$(docker ps -a --format '{{.Names}} {{.Status}}')
            volumes=$(docker volume ls --format '{{.Name}}')
            echo 'application_container_metadata:'
            grep -E '^capital_tracker_' <<<"$containers" || true
            echo 'application_volume_names:'
            grep -Ei 'capital|tracker' <<<"$volumes" || true
          else
            echo 'docker_access=no'
          fi
          printf 'capital_vhost_enabled=%s\n' "$(test -L /etc/nginx/sites-enabled/capital.pavelars.ru && echo yes || echo no)"
          INVENTORY
      - name: Remove ephemeral runner SSH credential
        if: always()
        run: rm -f ~/.ssh/inventory-key
